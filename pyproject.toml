[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topcc"
version = "0.2.0"
description = "Acceleration-aware Kinematic Orienteering with MOVNS"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
topcc = "topcc.main:main"

[tool.setuptools]
packages = [
    "topcc",
    "topcc.batch",
    "topcc.entities",
    "topcc.entities.evaluation",
    "topcc.entities.evaluation.batch",
    "topcc.entities.motion",
    "topcc.entities.neighborhoods",
    "topcc.entities.problem",
    "topcc.entities.repair",
    "topcc.entities.routing",
    "topcc.entities.search",
    "topcc.entities.search.epsilon",
    "topcc.evaluation_core",
]
package-dir = {topcc = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
